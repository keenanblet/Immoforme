<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Immoform</title>
</head>
<body>
    <div class="container">

    
    <form id="loginForm">
        <h2>Connexion</h2>

        <input type="email" name="email" placeholder="Adresse e-mail" required>
        <input type="password" name="password" placeholder="Mot de passe" required>

        <button type="submit">Se connecter</button>

        <div class="link">
            <a onclick="showRegister()">Créer un compte</a><br>
            <a onclick="alert('Tu ajouteras ta page mot de passe oublié ici.')">
                Mot de passe oublié ?
            </a>
        </div>
    </form>

    
    <form id="registerForm">
        <h2>Créer un compte</h2>

        <input type="text" name="name" placeholder="Nom ou pseudo" required>
        <input type="email" name="email" placeholder="Adresse e-mail" required>
        <input type="password" name="password" placeholder="Mot de passe" required>

        <button type="submit">Créer le compte</button>

        <div class="link">
            <a onclick="showLogin()">Déjà un compte ? Se connecter</a>
        </div>
    </form>

</div>
    <footer>
        <p>&copy; 2025 Immoform. Tous droits réservés.</p>
    </footer>
    
</body>
</html>
